# gitleaks project config.
#
# Inherit the upstream default ruleset and allowlist test fixtures and
# example placeholders that are intrinsic to the project.
#
# Run locally: gitleaks detect           (full history)
#              gitleaks protect --staged (staged changes — pre-commit)

[extend]
useDefault = true

[allowlist]
description = "Project-specific false positives"

# Restrict skip rules to test files + the example template.
paths = [
    '''test_.*\.py''',
    '''config\.env\.example$''',
]

# Skip placeholder shapes commonly used in templates / docs.
regexes = [
    '''YOUR_[A-Z_]+''',
    '''REPLACE_ME''',
    '''XXXX+''',
    '''<[a-z_-]+>''',
    # Constant NAMES exported from the password module. generic-api-key
    # matches the identifier PBKDF2_ITERATIONS inside __all__; the value it
    # names is an iteration count (100_000), pinned by a mutation test.
    # Allowlisting the name, not a value: no literal is exempted here.
    '''PBKDF2_ITERATIONS''',
    # Env-var NAMES held in constants (X_KEY = "NOROSHI_V3_..."). The rule
    # fires on the identifier; a value assigned to one of these would still
    # be caught on its own, so only the name shape is exempted.
    '''NOROSHI_V3_[A-Z0-9_]+''',
]
