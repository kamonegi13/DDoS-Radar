# Pin the compose project name so named volumes stay stable regardless of the
# directory this repo is checked out into (2026-08-03 rename: the project name
# used to be derived from the directory, which silently re-pointed the DB volume).
name: noroshi

services:
  radar:
    build: .
    image: noroshi:latest
    container_name: noroshi
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "8000:8000"
    volumes:
      # Persist SQLite DB — named volume for reliable fsync on Docker Desktop Mac
      - radar-data:/app/radar/persistence
      # Mount your config — copy config.env.example → config.env and edit
      - ./config.env:/app/config.env
      # Optional: place custom plugin sensors here
      - ./plugins:/app/plugins
    environment:
      # SERVER_HOST must be 0.0.0.0 inside the container (bind to all interfaces)
      - SERVER_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  radar-data:
